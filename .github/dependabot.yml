# Dependabot v2 – richtig konfiguriert
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ----------------------------------------------------------
  # Python-Dependencies (requirements.txt)
  # ----------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    target-branch: "main"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"           # PR rebased sich selbst, wenn main weiterzieht
    versioning-strategy: "increase"    # bumpt Pinned-Versions in requirements.txt
    reviewers:
      - "JoKerIsCraZy"
    assignees:
      - "JoKerIsCraZy"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Minor/Patch in einem PR buendeln statt 5 separate PRs/Woche
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Security-Patches sofort, ohne Bündelung
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ----------------------------------------------------------
  # GitHub-Actions selbst (actions/checkout, setup-python, etc.)
  # ----------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    reviewers:
      - "JoKerIsCraZy"
    assignees:
      - "JoKerIsCraZy"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
