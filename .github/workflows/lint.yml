name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      # Blocking: der Baum ist sauber, Regressionen sollen die PR rot faerben.
      # Regeln, Ignores und line-length stehen in pyproject.toml.
      - name: Ruff lint
        run: ruff check . --output-format=github

      # Pruefen ob eingerueckt waere; nicht zwingend, nur Info.
      - name: Ruff format check (info)
        run: ruff format --check . --diff
        continue-on-error: true
