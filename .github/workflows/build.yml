name: Build OneTimeSecret-Client.exe

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile sanity check
        run: python -m py_compile OneTimeSecret_Client.py

      - name: Build single-file .exe
        run: |
          pyinstaller --onefile --windowed --name OneTimeSecret-Client `
            --icon assets/onetime.ico `
            --add-data "assets/onetime.ico;assets" `
            --hidden-import=keyring.backends.Windows `
            --hidden-import=win32timezone `
            OneTimeSecret_Client.py

      - name: Verify build output
        run: |
          if (-not (Test-Path dist/OneTimeSecret-Client.exe)) {
            Write-Error "OneTimeSecret-Client.exe wurde nicht erzeugt"
            exit 1
          }
          Get-Item dist/OneTimeSecret-Client.exe | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneTimeSecret-Client-${{ github.sha }}
          path: dist/OneTimeSecret-Client.exe
          retention-days: 30
          if-no-files-found: error
