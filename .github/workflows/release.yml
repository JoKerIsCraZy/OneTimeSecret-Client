name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version-Tag (z.B. v1.2.3) – nur fuer manuelle Releases'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history fuer Auto-Release-Notes

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
          } else {
            $tag = '${{ inputs.tag }}'
          }
          if (-not ($tag -match '^v\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$')) {
            Write-Error "Tag '$tag' entspricht nicht dem Schema vMAJOR.MINOR.PATCH"
            exit 1
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile sanity check
        run: python -m py_compile OneTimeSecret_Client.py

      - name: Build single-file .exe
        run: |
          pyinstaller --onefile --windowed --name OneTimeSecret-Client `
            --icon assets/onetime.ico `
            --add-data "assets/onetime.ico;assets" `
            --hidden-import=keyring.backends.Windows `
            --hidden-import=win32timezone `
            OneTimeSecret_Client.py

      - name: Rename .exe with version
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          Move-Item dist/OneTimeSecret-Client.exe "dist/OneTimeSecret-Client-$tag.exe"
          Get-Item "dist/OneTimeSecret-Client-$tag.exe" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OneTimeSecret-Client-${{ steps.ver.outputs.tag }}
          path: dist/OneTimeSecret-Client-*.exe
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OneTimeSecret Client ${{ steps.ver.outputs.tag }}
          files: dist/OneTimeSecret-Client-*.exe
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
