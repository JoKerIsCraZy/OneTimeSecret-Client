name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    # Windows ist die Zielplattform (tkinter, keyring-Backend). Linux laeuft mit,
    # weil nur dort die POSIX-Dateirechte der Konfigurationsdateien pruefbar sind.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Der vorgebaute Python braucht die Tk-Laufzeitbibliotheken, sonst
      # scheitert schon `import tkinter` beim Einlesen des Moduls.
      - name: Install Tk runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
