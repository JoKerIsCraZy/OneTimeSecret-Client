name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update release draft
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      # Drafter: maintains a single draft release on main and updates
      # its body each time a PR lands. commitish is pinned to main so
      # PR-triggered runs do not point the draft at refs/pull/N/merge
      # (the Releases API responds 422 in that case).
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          commitish: refs/heads/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Autolabeler is a separate sub-action since v7. Without it, PR
      # titles like "feat: ..." would not get auto-labelled and would
      # drop out of the changelog categories.
      # Only runs on PR events — on push:main there is no PR object to
      # label, and the action would fail with "Event type is wrong".
      - if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
