[project]
name = "onetimesecret-client"
version = "0.0.0"
description = "Windows desktop client for the OneTimeSecret v2 API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Ausrichtung in den Tabellen (STRINGS, REGIONS, Theme) ist Absicht.
    "E241",
    # `Optional[X]` statt `X | None`: bewusst beibehalten, der Code ist durchgehend so getypt.
    "UP007", "UP045",
    # Deutsche Typografie (Gedankenstrich, Mittelpunkt, Häkchen) ist in den
    # Übersetzungen und Kommentaren Absicht, kein versehentliches Unicode.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests greifen absichtlich auf private Helfer zu.
"tests/*" = ["SLF001"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
